name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GITHUB_TOKEN 需要的最小权限：读仓库、写 Pages、签 OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务，但不动正在发布的那次
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 ci 而不是 install：严格按 package-lock.json 装，保证构建可复现
      - name: 安装依赖
        run: npm ci

      - name: 跑测试
        run: npm test

      - name: 构建
        run: npm run build

      # enablement: true —— 仓库还没开 Pages 时自动替你打开（Source 设为 GitHub Actions）
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
